# Transactions under concurrency, decided by outside authorities.
#
#   temper scenarios run --scenario txn.hermitage --build
#
- id: txn.hermitage
  runner: temper
  name: Each isolation level prevents the anomalies PostgreSQL's guarantees say it prevents
  description: >
    Martin Kleppmann's Hermitage scripts each anomaly, G0 to G2, as statements
    from two or three sessions in a fixed order (github.com/ept/hermitage
    @f029bec, postgres.md). The oracle runs every script at every isolation
    level, one connection per session, and decides each anomaly from what the
    sessions read, which commits succeeded and the final state, never from
    whether a statement blocked. A level the subject declares unsupported
    must be refused when requested; if it is accepted, its scripts still run.
  compose: temper/compose.yml
  subjects:
    postgres.reference: {db_postgres: 1}
    doltgres.release: {db_release: 1}
    doltgres.main: {db_main: 1}
  covers: [txn.no_dirty_write, txn.no_dirty_read, txn.no_circular_info, txn.no_lost_update, txn.no_read_skew, txn.no_write_skew, "txn.isolation/read committed", "txn.isolation/repeatable read", txn.isolation/serializable]
  events:
    - up: {$subject: true}
    - wait_until: {ready: ["{subject}"], equals: "1", timeout: 120s}
    - check:
        results:
          hermitage: ["{subject}"]
          decides: [txn.no_dirty_write, txn.no_dirty_read, txn.no_circular_info, txn.no_lost_update, txn.no_read_skew, txn.no_write_skew, txn.isolation/*]
          exempts: [txn.no_read_skew, txn.no_write_skew, txn.isolation/*]

- id: txn.elle
  runner: temper
  name: Under concurrent load, no subject shows dirty writes, dirty reads, circular reads or lost updates
  description: >
    Eight clients run short transactions of appends and reads on six hot
    keys for 20 s per level, each recording its outcome: committed, aborted,
    or unknown. Elle (jepsen-io/elle, via ligurio/elle-cli 0.1.11) checks
    each level's history: read committed against read-committed, repeatable
    read against snapshot isolation (PostgreSQL's repeatable read), and
    serializable against serializable. Only anomalies the level must prevent
    count. A level the subject declares unsupported is checked too if it is
    accepted, since a client that asks for it gets it.
  compose: temper/compose.yml
  subjects:
    postgres.reference: {db_postgres: 1}
    doltgres.release: {db_release: 1}
    doltgres.main: {db_main: 1}
  covers: [txn.no_dirty_write, txn.no_dirty_read, txn.no_circular_info, txn.no_lost_update, "txn.isolation/read committed"]
  events:
    - up: {$subject: true}
    - wait_until: {ready: ["{subject}"], equals: "1", timeout: 120s}
    - check:
        results:
          elle: ["{subject}", "20", common]
          decides: [txn.no_dirty_write, txn.no_dirty_read, txn.no_circular_info, txn.no_lost_update, "txn.isolation/read committed"]

- id: txn.elle_strict
  runner: temper
  name: Under concurrent load, repeatable read shows no read skew and serializable no write skew
  description: >
    The same workload and checker as txn.elle, at repeatable read (snapshot
    isolation) and serializable, for the subjects that support them. A
    negative control shows the workload can produce write skew Elle sees:
    PostgreSQL's repeatable-read history, checked as serializable, finds
    G2-item. Doltgres declares both levels unsupported and is exempt from
    these claims; txn.hermitage proves its refusals.
  compose: temper/compose.yml
  subject: postgres.reference
  covers: [txn.no_read_skew, txn.no_write_skew, "txn.isolation/repeatable read", txn.isolation/serializable]
  events:
    - up: {db_postgres: 1}
    - wait_until: {ready: ["{subject}"], equals: "1", timeout: 120s}
    - check:
        results:
          elle: ["{subject}", "20", strict]
          decides: [txn.no_read_skew, txn.no_write_skew, "txn.isolation/repeatable read", txn.isolation/serializable]

- id: txn.cross_column
  runner: temper
  name: Two updates to one row, each filtering on the column the other writes, never both apply
  description: >
    The one-command repro for the lost update across columns (the remainder
    of dolthub/doltgresql#3617). T1 runs UPDATE acct SET status = 'closed'
    WHERE id = 1 AND balance = 0; T2 runs UPDATE acct SET balance = balance +
    100 WHERE id = 1 AND status = 'open'; T1 commits, then T2. PostgreSQL's
    read committed makes T2 wait for T1 and re-check its WHERE against the
    new row, so it updates nothing and the account ends closed with 0. Ten
    runs at read committed; any run that ends closed with 100, a state no
    serial order produces, is a violation.
  compose: temper/compose.yml
  subjects:
    postgres.reference: {db_postgres: 1}
    doltgres.release: {db_release: 1}
    doltgres.main: {db_main: 1}
  covers: [txn.no_lost_update]
  events:
    - up: {$subject: true}
    - wait_until: {ready: ["{subject}"], equals: "1", timeout: 180s}
    - check:
        results:
          cross_column: ["{subject}", "10"]
          decides: [txn.no_lost_update]
