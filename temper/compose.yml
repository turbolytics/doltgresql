# One database per subject, and the oracle that runs the checks against it.
# Each scenario starts only its subject's database. Every database service is
# named db_*, so the service pack's faults (db.kill and the rest) hit whichever
# one is running.
services:
  db_postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: password}
    healthcheck: {test: [CMD, pg_isready, -U, postgres], interval: 1s, retries: 60}
  db_release:
    image: dolthub/doltgresql:1.5.3
    environment: {DOLTGRES_PASSWORD: password}
  db_main:
    # Built once from this checkout by temper/recipe/build_main.sh, not by
    # --build: a from-source build leaves gigabytes of Go cache per project.
    image: doltgres-main-source
    environment: {DOLTGRES_PASSWORD: password}
  oracle:
    build: {context: recipe/oracle}
    image: doltgres-recipe-oracle
    volumes: ["./subjects:/temper/subjects:ro", "ledger:/ledger"]
volumes:
  ledger: {}
